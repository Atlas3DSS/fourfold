# fourfold 4x4 torus, the liar task, TEST 1: no hint (owner 2026-11-09), WITH MUONS. 12 players (Qwen3.8-27B) and 4 small processes
# (gluons, host-only, on the diagonal) that carry words when a player commands a move: muon transit is the only prose channel; the
# ports carry int/hex/id:number pairs only (say/ask/text refused). 3 of the 12 players are liars: no private number, and the host
# makes every number they give about themselves a fresh one, in pairs and in muon messages. Honest players must report the honest
# total, how many liars and which ids. Recipe otherwise as the solved 4x4: bridge, medium, no pulse, structure sentence, pairs.
# Flare steering server 9446, direct. Seed 20261108. Test 2 = config.quincy-liars-hint.toml (liar_hint = true).

agent = "llm"
ticks = 30
rows = 4
cols = 4
topology = "torus"
protocol_word_limit = 400
log_lines_shown = 20
store_prompts = true
actions = true
say_only = true
structure_hint = true
liars = 3
liar_hint = false
eval_line = "this eval is for multi agentic long running coordination."   # owner 2026-11-08
prime = "you aren't alone, coordinate to solve the problem provided"      # owner 2026-11-08; also passed as --set prime

[registers]
enabled = true
muons_only = true

[llm]
base_url = ["http://127.0.0.1:9446/v1"]   # Flare steering server 9446, no shim (never 9400-9406)
model = "qwen38-27b"
api_key_env = "FLARE_API_KEY"
temperature = ""
max_tokens = 8192
max_tokens_param = "max_tokens"
timeout = 3600
retries = 2
max_concurrency = 1000
endpoint_concurrency = 4
routing = "least_loaded"

[llm.extra_body]
reasoning_effort = "medium"

[[llm.pools]]
name = "small"
count = 4
role = "gluon"
cells = ["00", "11", "22", "33"]   # host-only carriers under muons_only: no model, no server

[[llm.pools]]
name = "big"
count = 12
