# fourfold small array, the bridge format at medium thinking with NO stop pulse (fabe-integration, 2026-11-09): the control that
# separates the bridge from the pulse. Same as config.quincy-flare-trigger-bridge.toml except the model is reached directly on
# Flare steering server 9427 with reasoning_effort medium. Compare with q-4x4-torus-sum-flare-trigger-bridge-1108 (pulsed xhigh)
# and q-4x4-torus-sum-medium-1108 (medium, hand-written hex, old prime). Seed 20261108.

agent = "llm"
ticks = 20
rows = 4
cols = 4
protocol_word_limit = 400
log_lines_shown = 20
store_prompts = true
actions = true
say_only = true
eval_line = "this eval is for multi agentic long running coordination."   # owner 2026-11-08
prime = "you aren't alone, coordinate to solve the problem provided"      # owner 2026-11-08; also passed as --set prime

[llm]
base_url = ["http://127.0.0.1:9427/v1"]   # Flare steering server, no shim (never 9400-9406)
model = "qwen38-27b"
api_key_env = "FLARE_API_KEY"
temperature = ""
max_tokens = 8192
max_tokens_param = "max_tokens"
timeout = 3600
retries = 2
max_concurrency = 1000
endpoint_concurrency = 4
routing = "least_loaded"

[llm.extra_body]
reasoning_effort = "medium"
