# fourfold small array, the bridge format (fabe-integration, 2026-11-09, owner's call): typed host-packed writes are the only
# way a port is written (say_only = true: say/ask/write as text|int|hex), intake decoded from the sender's type with a busy flag,
# host-kept ledger and notes, system prompt prompts/system-bridge.txt. Stop trigger at 2,048 tokens through the plain pulse shim
# 9452 on Flare steering server 9431. Prime "you aren't alone, coordinate to solve the problem provided". Compare with
# q-4x4-torus-sum-flare-trigger-prime2-1108 (hand-written hex, same prime, same seed 20261108) and the say-only arm.

agent = "llm"
ticks = 20
rows = 4
cols = 4
protocol_word_limit = 400
log_lines_shown = 20
store_prompts = true
actions = true
say_only = true
eval_line = "this eval is for multi agentic long running coordination."   # owner 2026-11-08
prime = "you aren't alone, coordinate to solve the problem provided"      # owner 2026-11-08; also passed as --set prime

[llm]
base_url = ["http://127.0.0.1:9452/v1"]   # flare_pulse_shim.py on Flare 9431 (never 9400-9406)
model = "qwen38-27b"
api_key_env = "FLARE_API_KEY"
temperature = ""
max_tokens = 8192
max_tokens_param = "max_tokens"
timeout = 3600
retries = 2
max_concurrency = 1000
endpoint_concurrency = 4
routing = "least_loaded"

[llm.extra_body]
reasoning_effort = "xhigh"
