# fourfold small array: bridge + medium (no pulse) + structure sentence + the typed id:number pair write (fabe-integration,
# 2026-11-09). 30 ticks. Direct on Flare steering server 9436 (think_server index 36). Compare with
# q-4x4-torus-sum-bridge-medium-structure-1109 (same but no pairs type, 20 ticks; count 0.789, closest sum 6697 vs 6637).

agent = "llm"
ticks = 30
rows = 4
cols = 4
protocol_word_limit = 400
log_lines_shown = 20
store_prompts = true
actions = true
say_only = true
structure_hint = true
eval_line = "this eval is for multi agentic long running coordination."   # owner 2026-11-08
prime = "you aren't alone, coordinate to solve the problem provided"      # owner 2026-11-08; also passed as --set prime

[llm]
base_url = ["http://127.0.0.1:9436/v1"]   # Flare steering server 9436, no shim (never 9400-9406)
model = "qwen38-27b"
api_key_env = "FLARE_API_KEY"
temperature = ""
max_tokens = 8192
max_tokens_param = "max_tokens"
timeout = 3600
retries = 2
max_concurrency = 1000
endpoint_concurrency = 4
routing = "least_loaded"

[llm.extra_body]
reasoning_effort = "medium"
