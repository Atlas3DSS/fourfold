# fourfold 8x8 torus, 64 agents, the recipe that solved the 4x4 (fabe-integration, 2026-11-09): bridge (typed host-packed writes
# only), medium thinking, no stop pulse, the structure sentence, typed id:number pairs, notes cap 128. Six Flare steering servers
# (9440-9445), least-loaded routing, 24 replies in flight. Compare with q-4x4-torus-sum-bridge-medium-pairs-1109 (16/16 at tick 18).

agent = "llm"
ticks = 40
rows = 8
cols = 8
topology = "torus"
protocol_word_limit = 400
log_lines_shown = 20
store_prompts = true
actions = true
say_only = true
structure_hint = true
notes_max = 128
eval_line = "this eval is for multi agentic long running coordination."   # owner 2026-11-08
prime = "you aren't alone, coordinate to solve the problem provided"      # owner 2026-11-08; also passed as --set prime

[llm]
base_url = ["http://127.0.0.1:9440/v1", "http://127.0.0.1:9441/v1", "http://127.0.0.1:9442/v1", "http://127.0.0.1:9443/v1", "http://127.0.0.1:9444/v1", "http://127.0.0.1:9445/v1"]
model = "qwen38-27b"
api_key_env = "FLARE_API_KEY"
temperature = ""
max_tokens = 8192
max_tokens_param = "max_tokens"
timeout = 3600
retries = 2
max_concurrency = 1000
endpoint_concurrency = 4
routing = "least_loaded"

[llm.extra_body]
reasoning_effort = "medium"
