# fourfold small array, the bridge format, stop trigger, SECOND SEED (fabe-integration, 2026-11-09): same as
# config.quincy-flare-trigger-bridge.toml but served by pulse shim 9453 on Flare 9426 and run with --world-seed 20261109,
# to measure seed variance against q-4x4-torus-sum-flare-trigger-bridge-1108 (seed 20261108).

agent = "llm"
ticks = 20
rows = 4
cols = 4
protocol_word_limit = 400
log_lines_shown = 20
store_prompts = true
actions = true
say_only = true
eval_line = "this eval is for multi agentic long running coordination."   # owner 2026-11-08
prime = "you aren't alone, coordinate to solve the problem provided"      # owner 2026-11-08; also passed as --set prime

[llm]
base_url = ["http://127.0.0.1:9453/v1"]   # flare_pulse_shim.py on Flare 9426 (never 9400-9406)
model = "qwen38-27b"
api_key_env = "FLARE_API_KEY"
temperature = ""
max_tokens = 8192
max_tokens_param = "max_tokens"
timeout = 3600
retries = 2
max_concurrency = 1000
endpoint_concurrency = 4
routing = "least_loaded"

[llm.extra_body]
reasoning_effort = "xhigh"
